<style>
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);

        }
        .stepper-line {
            background: linear-gradient(to bottom, #b7122a 50%, #e5e2e1 50%);

            background-position: bottom;
            transition: background-position 0.5s ease;
        }
        .pulse-primary {
            box-shadow: 0 0 0 0 rgba(183, 18, 42, 0.4);

<body class="bg-background text-on-surface font-body-md overflow-hidden">

</div>
<div class="flex items-center gap-sm">

                    Help

</div>

<path class="opacity-60" d="M100 600 C 150 500, 250 500, 300 400" stroke="#b7122a" stroke-dasharray="8 8" stroke-width="4"></path>

<span class="material-symbols-outlined">my_location</span>
</button>
<button class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-error hover:bg-error-container active:scale-90 transition-all">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Main Tracking Card -->
<section class="absolute bottom-0 left-0 right-0 z-30 px-container-margin pb-xl">
<div class="max-w-[600px] mx-auto">
<!-- Status & Stepper Card -->
<div class="bg-white rounded-[32px] shadow-[0px_20px_50px_rgba(0,0,0,0.15)] p-md space-y-lg border border-surface-variant/20">

<div class="flex justify-between items-start">
<div class="space-y-base">
<p class="text-primary font-label-md tracking-wider">ON THE WAY</p>

</div>
<div class="bg-primary-fixed/30 p-3 rounded-2xl">

</div>
<div class="h-px bg-surface-variant/30"></div>

<div class="absolute -bottom-1 -right-1 bg-tertiary text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold flex items-center gap-0.5">
                                    4.9 <span class="material-symbols-outlined text-[10px]" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">live_tv</span>
<span class="font-label-sm text-label-sm">Live</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:opacity-80 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
<script>
        // Micro-interaction for the "Live" navigation tab
        document.addEventListener('DOMContentLoaded', () => {
            const liveTab = document.querySelector('nav a:nth-child(3)');
            if (liveTab) {
                // Subtle pulse to indicate active tracking
                setInterval(() => {
                    liveTab.classList.toggle('opacity-90');
                }, 1000);
            }
            
            // Simulation of arrival time countdown (visual only)
            let mins = 12;
            const timerText = document.querySelector('h2');
            if (timerText) {
                setInterval(() => {
                    if (Math.random() > 0.9) { // Low probability of "ticking" for demo feel
                        mins = Math.max(1, mins - 1);
                        timerText.textContent = `Arriving in ${mins} mins`;
                    }
                }, 10000);
            }
        });
    </script>
